<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E1A24">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<title>Last Seen: a murder logic puzzle</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Special+Elite&display=swap" rel="stylesheet">
<style>:root{--bg:#EEE7F0;--surface:#FFFFFF;--ink:#2A2230;--muted:#6D6173;--line:#D8CEDC;--accent:#8E5F0E;--accent-ink:#fff;--wall:#3A2F3F;--bad:#B3261E;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1E1A24;--surface:#2A2433;--ink:#F1EAF3;--muted:#A99BB0;--line:#3E3547;--accent:#D9A94A;--accent-ink:#231a0a;--bad:#FF8A80}}
:root[data-theme="dark"]{--bg:#1E1A24;--surface:#2A2433;--ink:#F1EAF3;--muted:#A99BB0;--line:#3E3547;--accent:#D9A94A;--accent-ink:#231a0a;--bad:#FF8A80}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:16px;line-height:1.45}
#app{max-width:540px;margin:0 auto;padding:0 14px 32px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 18px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:17px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn:disabled{opacity:.4;cursor:default}
.btn .count{color:var(--muted);font-weight:500}
.btn.small{padding:10px 6px;font-size:15px;border-radius:11px}
/* home */
.home{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:6vh 0 20px}
.hero{position:relative;padding:20px 0 34px}
.hero h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(72px,24vw,128px);line-height:.82;letter-spacing:-.045em;margin:0;position:relative;z-index:1;font-variation-settings:"wdth" 75}
.hero-board{position:absolute;right:0;top:0;width:44%;aspect-ratio:1;display:grid;grid-template-columns:repeat(4,1fr);border:3px solid var(--wall);border-radius:6px;overflow:hidden;transform:rotate(6deg);opacity:.9}
.hero-board i{display:grid;place-items:center;border:.5px solid rgba(58,47,63,.2)}
.hero-board b{width:62%;aspect-ratio:1;border-radius:50%;box-shadow:0 0 0 2px #fff}
.tag{font-family:"Special Elite",monospace;color:var(--muted);margin:22px 0 0;max-width:30ch;font-size:15px}
.home-actions{display:grid;gap:10px}
/* bars */
.bar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:6px;padding:10px 0;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.bar h2{margin:0;text-align:center;font-size:18px;font-weight:700;line-height:1.15}
.bar h2 small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.icon{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:22px;line-height:1;font-weight:600}
/* cases */
.chapter{margin:18px 0 26px}
.chapter h3{margin:0 0 10px;font-size:22px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.chapter h3 small{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px}
.tile{aspect-ratio:1;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
.tile .num{font-size:20px;font-weight:800}
.tile .stars{font-size:11px;color:var(--accent);letter-spacing:1px;min-height:14px}
.tile.done{border-color:var(--accent)}
.tile:disabled{opacity:.45;cursor:default}
/* game */
.brief{font-family:"Special Elite",monospace;font-size:14px;color:var(--muted);margin:2px 0 10px;text-align:center}
.board-wrap{display:grid;grid-template-columns:18px 1fr;grid-template-rows:18px auto;gap:3px;margin:0 auto;max-width:480px}
.compass{font-size:10px;font-weight:700;color:var(--muted);display:grid;place-items:center}
.colhead,.rowhead{display:grid;font-size:11px;font-weight:700;color:var(--muted);text-align:center}
.colhead{grid-template-columns:repeat(var(--n),1fr);align-items:end}
.rowhead{grid-template-rows:repeat(var(--n),1fr);align-items:center}
.board{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));grid-template-rows:repeat(var(--n),minmax(0,1fr));aspect-ratio:1;border:3px solid var(--wall);border-radius:4px;box-shadow:0 6px 18px rgba(30,20,40,.25);overflow:hidden;background:var(--wall)}
.cell{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation;position:relative;border:0;padding:0;display:block;overflow:hidden;aspect-ratio:1;box-shadow:inset 0 0 0 .5px rgba(58,47,63,.22);min-width:0}
.board-box{position:relative}
.labels{position:absolute;inset:3px;pointer-events:none;z-index:4}
.rlabel{position:absolute;display:flex;justify-content:center;padding-top:2px}
.rlabel b{font-size:clamp(9px,calc(88vw / var(--n) * .21),12px);font-weight:700;line-height:1.2;color:#2A2230;background:rgba(255,253,248,.88);border:1px solid rgba(58,47,63,.45);border-radius:4px;padding:0 4px;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.cell::after{content:"";position:absolute;inset:0;border:0 solid var(--wall);pointer-events:none;z-index:3}
.cell.wt::after{border-top-width:2.5px}.cell.wb::after{border-bottom-width:2.5px}.cell.wl::after{border-left-width:2.5px}.cell.wr::after{border-right-width:2.5px}
.cell .obj{position:absolute;inset:3%;display:grid;place-items:center;pointer-events:none}
.cell .obj svg{width:100%;height:100%}
.cell.has .obj{opacity:.5}
.cell .tok{position:absolute;left:14%;top:14%;width:72%;height:72%;z-index:2}
.cell .x{position:absolute;inset:0;display:grid;place-items:center;z-index:2;pointer-events:none}
.x svg{width:70%;height:70%;fill:none;stroke-linecap:round}
.x.man svg{stroke:#7A1F2B;stroke-width:1.5;opacity:.85}
.x.auto svg{stroke:#3A2F3F;stroke-width:1.2;opacity:.42}
.notes{position:absolute;inset:5%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);z-index:2;pointer-events:none}
.note{font-style:normal;font-weight:800;font-size:clamp(8px,calc(88vw / var(--n) * .2),12px);line-height:1;color:var(--pc);background:#fff;border:1.5px solid var(--pc);border-radius:50%;aspect-ratio:1;height:100%;max-height:100%;justify-self:center;align-self:center;display:grid;place-items:center;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.note.s0{grid-area:3/1}.note.s1{grid-area:3/3}.note.s2{grid-area:1/1}.note.s3{grid-area:1/3}.note.s4{grid-area:3/2}.note.s5{grid-area:2/1}.note.s6{grid-area:2/3}.note.s7{grid-area:1/2}
.cell.blocked{cursor:not-allowed}
.tok{width:74%;aspect-ratio:1;border-radius:50%;background:var(--pc);color:#fff;display:grid;place-items:center;font-weight:800;font-size:clamp(13px,4.2vw,22px);box-shadow:0 0 0 2px #fff,0 2px 5px rgba(0,0,0,.35);position:relative;pointer-events:none;line-height:1}
.tok.victim{background:#2B2B2B;box-shadow:0 0 0 2px #fff,0 0 0 4px #2B2B2B,0 2px 5px rgba(0,0,0,.35)}
.tok.conf{box-shadow:0 0 0 3px var(--bad),0 0 0 5px #fff}
.tok.sel{animation:bob .9s ease-in-out infinite alternate}
.tok.lock::after{content:"";position:absolute;right:-3px;top:-3px;width:28%;aspect-ratio:1;border-radius:50%;background:#E8C27A;box-shadow:0 0 0 1.5px #fff}
@keyframes bob{to{transform:translateY(-12%) scale(1.06)}}
@media (prefers-reduced-motion:reduce){.tok.sel{animation:none;outline:3px solid var(--accent)}}
.rooms{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;margin:12px 0 4px;font-size:13px;color:var(--muted)}
.rooms span{display:flex;align-items:center;gap:6px}
.rooms i{width:14px;height:14px;border-radius:3px;border:1.5px solid var(--wall)}
.tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:6px;margin:12px 0}
.person{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);text-align:left;min-height:48px}
.person .tok{width:30px;flex:none;font-size:14px}
.person .pn{font-size:14px;font-weight:600;line-height:1.1;min-width:0;overflow-wrap:anywhere}
.person .pn small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.person.placed{opacity:.45}
.person.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent);opacity:1}
.person.big{min-height:56px}
.tray .person.v{grid-column:span 2}
.tools{display:grid;grid-template-columns:1fr 1fr 1fr 1.4fr;gap:6px}
.clues{margin-top:18px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px 8px}
.clues h3{margin:0 0 8px;font-size:17px;font-weight:800}
.clues ol{margin:0;padding:0 0 0 22px;font-family:"Special Elite",monospace;font-size:15px;line-height:1.5}
.clues li{padding:7px 0;border-top:1px dashed var(--line);cursor:pointer}
.clues li:first-child{border-top:0}
.clues li b{font-family:"Bricolage Grotesque",sans-serif;font-weight:700}
.clues li b.who{color:var(--ink);text-decoration:underline;text-decoration-color:var(--pc);text-decoration-thickness:3px;text-underline-offset:3px}
.clues li.struck{opacity:.4;text-decoration:line-through}
.clues li.bad{color:var(--bad)}
.clues li.bad::marker{content:"✗  "}
/* modal */
.modal{position:fixed;inset:0;background:rgba(20,12,26,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.sheet{background:var(--surface);border-radius:20px;padding:22px 20px 14px;max-width:520px;width:100%;max-height:85vh;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h2{margin:0 0 8px;font-size:24px;font-weight:800;letter-spacing:-.02em}
.sheet p{margin:0 0 14px}
.sheet .btn{margin-top:8px}
.rules{padding-left:20px;margin:0 0 14px}.rules li{margin:6px 0}
.howto{font-size:14px;color:var(--muted)}
.legend-objs{display:grid;grid-template-columns:repeat(3,1fr) auto;gap:8px;align-items:center;font-size:13px;margin-bottom:6px}
.legend-objs span{display:flex;flex-direction:column;align-items:center;background:#EDE3D3;color:#2A2230;border-radius:8px;padding:4px}
.legend-objs svg{width:34px;height:34px}
.legend-objs em{font-size:12px;color:var(--muted);font-style:normal;max-width:9ch}
.accuse-list{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.win{text-align:center}
.stars.big{font-size:40px;color:var(--accent);letter-spacing:4px}
.muted{color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.storage{font-size:14px;padding:10px 12px;border-radius:10px;background:rgba(179,38,30,.1);border:1px solid rgba(179,38,30,.3)}
.storage.ok{background:rgba(46,125,91,.12);border-color:rgba(46,125,91,.4)}

function colLetter(c){return "ABCDEFGH"[c]}

function clueText(l,c){
  const t=c[0],X=`<b class="who" style="--pc:${pc(l,c[1])}">${pname(l,c[1])}</b>`;
  const Y=()=>`<b class="who" style="--pc:${pc(l,c[2])}">${pname(l,c[2])}</b>`;
  const R=k=>`the <b>${l.rooms[k]}</b>`;
  switch(t){
    case"in":return`${X} was in ${R(c[2])}.`;
    case"notin":return`${X} was not in ${R(c[2])}.`;
    case"on":return{C:`${X} was sitting on a chair.`,R:`${X} was standing on a rug.`,D:`${X} was lying on a bed.`}[c[2]];
    case"noton":return`${X} was standing on bare floor.`;
    case"row":return`${X} was in row ${c[2]+1}.`;
    case"col":return`${X} was in column ${colLetter(c[2])}.`;
    case"next":return`${X} was next to a ${OBJNAME[c[2]]}.`;
    case"notnext":return`${X} was not next to any ${OBJNAME[c[2]]}.`;
    case"corner":return`${X} was in a corner of the house.`;
    case"edge":return`${X} was against an outer wall.`;
    case"notedge":return`${X} was away from the outer walls.`;
    case"alone":return`${X} was alone in their room.`;
    case"same":return`${X} and ${Y()} were in the same room.`;
    case"diff":return`${X} and ${Y()} were in different rooms.`;
    case"north":return`${X} was somewhere north of ${Y()}.`;
    case"west":return`${X} was somewhere west of ${Y()}.`;
    case"diag":return`${X} and ${Y()} were diagonally touching.`;
    case"empty":return`Nobody was in ${R(c[1])}.`;
    case"count":return c[2]===1?`Exactly one person was in ${R(c[1])}.`:`Exactly ${c[2]} people were in ${R(c[1])}.`;
  }

function pc(l,i){return i===l.victim?"#2B2B2B":PCOL[i]}

function roomColors(l){
  const N=l.N,n=l.rooms.length,adj=[...Array(n)].map(()=>new Set());
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const a=l.g[r][c];
    if(r+1<N&&l.g[r+1][c]!==a){adj[a].add(l.g[r+1][c]);adj[l.g[r+1][c]].add(a)}
    if(c+1<N&&l.g[r][c+1]!==a){adj[a].add(l.g[r][c+1]);adj[l.g[r][c+1]].add(a)}}
  const col=[];const start=(l.title.length*3)%8;
  for(let i=0;i<n;i++){for(let k=0;k<8;k++){const cc=(start+i+k)%8;if(![...adj[i]].some(j=>col[j]===cc)){col[i]=cc;break}}}
  return col.map(c=>RCOL[c]);
}

function evalClue(l,pos,c){
  const N=l.N,g=l.g,o=l.obj;const cnt=new Array(l.rooms.length).fill(0);
  pos.forEach(p=>cnt[g[p[0]][p[1]]]++);
  const P=i=>pos[i],room=i=>g[pos[i][0]][pos[i][1]],ob=i=>o[pos[i][0]][pos[i][1]];
  const adj=i=>{const[r,cc]=pos[i],s=new Set();[[1,0],[-1,0],[0,1],[0,-1]].forEach(([a,b])=>{const R=r+a,C=cc+b;if(R>=0&&R<N&&C>=0&&C<N)s.add(o[R][C])});return s};
  const edge=i=>{const[r,cc]=pos[i];return r===0||r===N-1||cc===0||cc===N-1};
  const a=c[1],b=c[2];
  switch(c[0]){
    case"in":return room(a)===b;case"notin":return room(a)!==b;
    case"on":return ob(a)===b;case"noton":return!STAND.includes(ob(a));
    case"row":return P(a)[0]===b;case"col":return P(a)[1]===b;
    case"next":return adj(a).has(b);case"notnext":return!adj(a).has(b);
    case"corner":{const[r,cc]=P(a);return(r===0||r===N-1)&&(cc===0||cc===N-1)}
    case"edge":return edge(a);case"notedge":return!edge(a);
    case"alone":return cnt[room(a)]===1;
    case"same":return room(a)===room(b);case"diff":return room(a)!==room(b);
    case"north":return P(a)[0]<P(b)[0];case"west":return P(a)[1]<P(b)[1];
    case"diag":return Math.abs(P(a)[0]-P(b)[0])===1&&Math.abs(P(a)[1]-P(b)[1])===1;
    case"empty":return cnt[a]===0;case"count":return cnt[a]===b;
  }
}

/* ---------- game ---------- */
function startLevel(i){
  const l=LEVELS[i];
  const saved=load("lastseen2-game-"+i,null);
  G={i,l,colors:roomColors(l),pos:new Array(l.N).fill(null),marks:{},notes:{},locked:{},sel:null,hist:[],struck:{},bad:{},hints:0,fails:0,done:false};
  if(saved&&Array.isArray(saved.pos)&&saved.pos.length===l.N){Object.assign(G,{pos:saved.pos,marks:saved.marks||{},notes:saved.notes||{},locked:saved.locked||{},struck:saved.struck||{},hints:saved.hints||0,fails:saved.fails||0,done:!!saved.done,hist:Array.isArray(saved.hist)?saved.hist:[]})}
  renderGame();
}
function persist(){if(!G)return;save("lastseen2-game-"+G.i,{pos:G.pos,marks:G.marks,notes:G.notes,locked:G.locked,struck:G.struck,hints:G.hints,fails:G.fails,done:G.done,hist:G.hist.slice(-60)})}
function snap(){G.hist.push(JSON.stringify({pos:G.pos,marks:G.marks,notes:G.notes}));if(G.hist.length>200)G.hist.shift()}
function occupant(r,c){return G.pos.findIndex(p=>p&&p[0]===r&&p[1]===c)}
function conflicts(){const s=new Set();G.pos.forEach((p,i)=>{if(!p)return;G.pos.forEach((q,j)=>{if(j!==i&&q&&(q[0]===p[0]||q[1]===p[1]))s.add(i)})});return s}

function renderGame(){
  const l=G.l,N=l.N;

    <main class="game">
      <p class="brief">${G.done?`Solved. You can keep looking, or tap Clear to play it again.`:`${l.victimName} has been found dead. Who was alone with them?`}</p>
      <div class="board-wrap"><div class="compass" aria-hidden="true">N↑</div>
        <div class="colhead" style="--n:${N}">${[...Array(N)].map((_,c)=>`<span>${colLetter(c)}</span>`).join("")}</div>
        <div class="rowhead" style="--n:${N}">${[...Array(N)].map((_,r)=>`<span>${r+1}</span>`).join("")}</div>
        <div class="board-box"><div class="board" id="board" style="--n:${N}"></div><div class="labels" id="labels" style="--n:${N}">${roomLabels(l)}</div></div></div>
      <div class="rooms" id="rooms"></div>
      <div class="tray" id="tray"></div>
      <div class="tools"><button class="btn small" id="undo">Undo</button><button class="btn small" id="clear">Clear</button><button class="btn small" id="hint">Hint</button><button class="btn small primary" id="accuse">Accuse</button></div>
      <section class="clues"><h3>Witness notes</h3><ol id="clues"></ol></section>
    </main>`;
  $("#back").onclick=()=>{persist();showCases()};$("#help").onclick=showRules;
  $("#undo").onclick=()=>{const h=G.hist.pop();if(h){const s=JSON.parse(h);G.pos=s.pos;G.marks=s.marks;G.notes=s.notes||{};G.bad={};draw()}};
  $("#clear").onclick=()=>{
    const m=modal(`<h2>Start this case again?</h2><p>This removes everyone you placed, your crosses, notes, struck clues and hints. ${progress.solved[G.i]!=null?"Your stars for this case are kept.":""}</p><button class="btn primary" id="doclear">Start again</button><button class="btn ghost" data-close>Keep my progress</button>`);
    m.querySelector("#doclear").onclick=()=>{m.remove();
      Object.assign(G,{pos:new Array(G.l.N).fill(null),marks:{},notes:{},locked:{},struck:{},bad:{},sel:null,hints:0,fails:0,done:false,hist:[]});draw()}};
  $("#hint").onclick=hint;$("#accuse").onclick=accuse;
  $("#rooms").innerHTML=l.rooms.map((r,k)=>`<span><i style="background:${G.colors[k]}"></i>${r}</span>`).join("");
  draw();
}
function roomLabels(l){
  const N=l.N;let h="";
  l.rooms.forEach((name,k)=>{
    let best=null;
    for(let r=0;r<N;r++){let c=0;while(c<N){if(l.g[r][c]!==k){c++;continue}let s=c;while(c<N&&l.g[r][c]===k)c++;
      const len=c-s,score=Math.min(len,3)*10-r;if(!best||score>best.score)best={r,s,len,score}}}
    if(!best)return;
    h+=`<span class="rlabel" style="left:${best.s/N*100}%;top:${best.r/N*100}%;width:${best.len/N*100}%"><b>${name}</b></span>`;
  });return h;
}
const XSVG=cls=>`<span class="${cls}"><svg viewBox="0 0 10 10"><path d="M2.2 2.2L7.8 7.8M7.8 2.2L2.2 7.8"/></svg></span>`;
let LP={t:null,fired:false,x:0,y:0};
function draw(){
  const l=G.l,N=l.N,bd=$("#board"),conf=conflicts();let h="";
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const rm=l.g[r][c],o=l.obj[r][c],w=(dr,dc)=>{const R=r+dr,C=c+dc;return R<0||R>=N||C<0||C>=N||l.g[R][C]!==rm};
    const cls=["cell"];if(w(-1,0))cls.push("wt");if(w(1,0))cls.push("wb");if(w(0,-1))cls.push("wl");if(w(0,1))cls.push("wr");
    if(BLOCKED.includes(o))cls.push("blocked");
    const occ=occupant(r,c);let inner=o!=="."?`<span class="obj">${ICON[o]}</span>`:"";
    if(occ>=0){cls.push("has");inner+=`<span class="tok ${occ===l.victim?"victim":""} ${conf.has(occ)?"conf":""} ${G.sel===occ?"sel":""} ${G.locked[occ]?"lock":""}" style="--pc:${pc(l,occ)}">${occ===l.victim?"✝":NAMES[occ][0]}</span>`}
    else if(!BLOCKED.includes(o)){
      const k=r+","+c;
      if(G.marks[k])inner+=XSVG("x man");
      else if(G.pos.some(p=>p&&(p[0]===r||p[1]===c)))inner+=XSVG("x auto");
      else{const ns=(G.notes[k]||[]).filter(i=>!G.pos[i]);
        if(ns.length)inner+=`<span class="notes">${ns.map((i,j)=>`<i class="note s${j}" style="--pc:${pc(l,i)}">${i===l.victim?"✝":NAMES[i][0]}</i>`).join("")}</span>`}
    }
    h+=`<button class="${cls.join(" ")}" style="background:${G.colors[rm]}" data-r="${r}" data-c="${c}" aria-label="Row ${r+1} column ${colLetter(c)}, ${l.rooms[rm]}${o!=="."?", "+OBJNAME[o]:""}${occ>=0?", "+pname(l,occ):""}">${inner}</button>`;
  }
  bd.innerHTML=h;
  bd.oncontextmenu=e=>e.preventDefault();
  bd.querySelectorAll(".cell").forEach(b=>{const r=+b.dataset.r,c=+b.dataset.c;
    b.addEventListener("pointerdown",e=>{LP.fired=false;LP.x=e.clientX;LP.y=e.clientY;clearTimeout(LP.t);LP.t=setTimeout(()=>{LP.fired=true;longPress(r,c)},450)});
    b.addEventListener("pointermove",e=>{if(Math.hypot(e.clientX-LP.x,e.clientY-LP.y)>10)clearTimeout(LP.t)});
    ["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,()=>clearTimeout(LP.t)));
    b.onclick=()=>{if(LP.fired){LP.fired=false;return}tapCell(r,c)};
  });
  $("#tray").innerHTML=[...Array(N).keys()].map(i=>`<button class="person ${i===l.victim?"v":""} ${G.pos[i]?"placed":""} ${G.sel===i?"sel":""}" data-i="${i}"><span class="tok ${i===l.victim?"victim":""}" style="--pc:${pc(l,i)}">${i===l.victim?"✝":NAMES[i][0]}</span><span class="pn">${pname(l,i)}${i===l.victim?"<small>victim</small>":""}</span></button>`).join("");
  $("#tray").querySelectorAll(".person").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(G.locked[i])return toast(`${pname(l,i)} was placed by a hint.`);G.sel=G.sel===i?null:i;draw()});
  $("#clues").innerHTML=l.clues.map((c,k)=>`<li class="${G.struck[k]?"struck":""} ${G.bad[k]?"bad":""}" data-k="${k}">${clueText(l,c)}</li>`).join("");
  $("#clues").querySelectorAll("li").forEach(li=>li.onclick=()=>{const k=+li.dataset.k;G.struck[k]=!G.struck[k];draw()});
  const all=G.pos.every(p=>p);$("#accuse").disabled=!all;
  persist();
}
function tapCell(r,c){
  const l=G.l,o=l.obj[r][c],occ=occupant(r,c);
  if(G.sel!=null){
    if(occ===G.sel){snap();G.pos[G.sel]=null;G.sel=null;G.bad={};return draw()}
    if(BLOCKED.includes(o)){toast(`Nobody can stand on a ${OBJNAME[o]}.`);return}
    if(occ>=0&&G.locked[occ]){toast(`${pname(l,occ)} is fixed there by a hint.`);return}
    snap();if(occ>=0)G.pos[occ]=null;G.pos[G.sel]=[r,c];delete G.marks[r+","+c];G.sel=null;G.bad={};return draw();
  }
  if(occ>=0){if(G.locked[occ])return toast(`${pname(l,occ)} is fixed there by a hint.`);G.sel=occ;return draw()}
  if(BLOCKED.includes(o))return;
  snap();const k=r+","+c;if(G.marks[k])delete G.marks[k];else G.marks[k]=1;draw();
}
function longPress(r,c){
  const l=G.l,o=l.obj[r][c];
  if(G.sel==null)return toast("Select a person first, then long-press a square to note them there.");
  if(BLOCKED.includes(o))return toast(`Nobody can stand on a ${OBJNAME[o]}.`);
  if(occupant(r,c)>=0)return;
  const k=r+","+c,cur=G.notes[k]||[];snap();
  if(cur.includes(G.sel))G.notes[k]=cur.filter(i=>i!==G.sel);else G.notes[k]=[...cur,G.sel];
  if(!G.notes[k].length)delete G.notes[k];
  delete G.marks[k];
  try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}
  draw();
}
function hint(){
  const l=G.l;const wrong=[...Array(l.N).keys()].filter(i=>!G.pos[i]||G.pos[i][0]!==l.pos[i][0]||G.pos[i][1]!==l.pos[i][1]);
  if(!wrong.length)return toast("Everyone is already in the right place. Time to accuse.");
  // prefer a non-victim, non-murderer first so hints don't give away the answer
  wrong.sort((a,b)=>(a===l.victim||a===l.murderer)-(b===l.victim||b===l.murderer));
  const i=wrong[0],[r,c]=l.pos[i];snap();
  const occ=occupant(r,c);if(occ>=0)G.pos[occ]=null;
  G.pos[i]=[r,c];G.locked[i]=true;G.hints++;G.sel=null;G.bad={};draw();
  toast(`${pname(l,i)} was in row ${r+1}, column ${colLetter(c)}.`);
}
function accuse(){
  const l=G.l;
  const opts=[...Array(l.N).keys()].filter(i=>i!==l.victim).map(i=>`<button class="person big" data-i="${i}"><span class="tok" style="--pc:${pc(l,i)}">${NAMES[i][0]}</span><span class="pn">${NAMES[i]}</span></button>`).join("");
  const m=modal(`<h2>Who killed ${l.victimName}?</h2><p>Your board will be checked against every note.</p><div class="accuse-list">${opts}</div><button class="btn ghost" data-close>Not yet</button>`);
  m.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{m.remove();judge(+b.dataset.i)});
}
function judge(pick){
  const l=G.l;
  if(conflicts().size){G.fails++;persist();return verdict("Not quite","Two people are sharing a row or a column. Each row and column holds exactly one person.")}
  const g=l.g,vr=g[G.pos[l.victim][0]][G.pos[l.victim][1]];
  const inV=G.pos.filter(p=>g[p[0]][p[1]]===vr).length;
  G.bad={};l.clues.forEach((c,k)=>{if(!evalClue(l,G.pos,c))G.bad[k]=1});
  const nb=Object.keys(G.bad).length;
  if(nb){G.fails++;draw();return verdict("The story doesn’t hold",`${nb===1?"One note contradicts":nb+" notes contradict"} your board. They’re marked in red.`)}
  if(inV!==2){G.fails++;draw();return verdict("Not quite",`The victim must share their room with exactly one person, the murderer. Right now the ${l.rooms[vr]} holds ${inV===1?"only the victim":inV+" people"}.`)}
  if(pick!==l.murderer){G.fails++;persist();return verdict("Wrong suspect","Your board is right, but look again at who was alone with the victim.")}
  const stars=Math.max(1,3-G.hints-G.fails);
  progress.solved[G.i]=Math.max(stars,progress.solved[G.i]||0);save("lastseen-progress",progress);
  G.done=true;persist();
  const last=G.i===LEVELS.length-1;
  const m=modal(`<div class="win"><div class="stars big">${"★".repeat(stars)}${"☆".repeat(3-stars)}</div><h2>Case closed</h2>
    <p><b style="color:${PCOL[pick]}">${NAMES[pick]}</b> was alone with ${l.victimName} in the ${l.rooms[vr]}.</p>
    ${stars<3?`<p class="muted">${G.hints?`${G.hints} hint${G.hints>1?"s":""}`:""}${G.hints&&G.fails?" and ":""}${G.fails?`${G.fails} wrong accusation${G.fails>1?"s":""}`:""} cost ${3-stars} star${3-stars>1?"s":""}.</p>`:""}
    ${last?`<p>That was the final case. Every murder at the palace is solved.</p>`:""}
    <button class="btn primary" id="nx">${last?"Back to case files":`Next case`}</button><button class="btn ghost" data-close>Stay here</button></div>`);
  m.querySelector("#nx").onclick=()=>{m.remove();last?showCases():startLevel(G.i+1)};
}
function verdict(t,msg){modal(`<h2>${t}</h2><p>${msg}</p><button class="btn primary" data-close>Keep investigating</button>`)}
let tt;function toast(msg){let t=$(".toast");if(!t){t=document.createElement("div");t.className="toast";document.body.appendChild(t)}t.textContent=msg;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),2200)}
if(IS_PWA){askPersist();window.addEventListener("appinstalled",askPersist)}
document.addEventListener("visibilitychange",()=>{if(document.hidden)persist()});
window.addEventListener("pagehide",persist);
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;setupInstall()});
window.addEventListener("appinstalled",()=>{deferredPrompt=null;setupInstall();toast("Installed. Find Last Seen on your home screen.")});
function setupInstall(){const b=document.getElementById("install");if(!b)return;b.hidden=!deferredPrompt;
  b.onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;setupInstall()}}
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
showHome();
</script></body></html>
